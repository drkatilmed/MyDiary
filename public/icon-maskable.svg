<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="50%" stop-color="#fd6c9e"/>
      <stop offset="100%" stop-color="#e64980"/>
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="softShadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7a1843" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full bleed background for Android maskable -->
  <rect width="512" height="512" fill="url(#bgGradM)"/>

  <!-- Centered scaled content within 80% safe zone circle (scale 0.78, center at 256, 256) -->
  <g transform="translate(56, 56) scale(0.78)">
    <g filter="url(#softShadowM)">
      <!-- Book Main Cover -->
      <rect x="135" y="110" width="250" height="295" rx="22" fill="#ffffff"/>
      <!-- Book Spine Highlight -->
      <path d="M135 110 L165 110 L165 405 L135 405 Z" fill="#ffd1df"/>
      <!-- Gold Ribbon Bookmark -->
      <path d="M230 105 L270 105 L270 230 L250 205 L230 230 Z" fill="url(#goldGradM)"/>
      <!-- Heart on Book Cover -->
      <path d="M280 280 C280 255 305 240 325 260 C345 240 370 255 370 280 C370 310 325 340 325 340 C325 340 280 310 280 280 Z" fill="#fd6c9e"/>
      <!-- Diary Pages Lines -->
      <rect x="190" y="270" width="65" height="8" rx="4" fill="#ffd1df"/>
      <rect x="190" y="295" width="50" height="8" rx="4" fill="#ffd1df"/>
      <rect x="190" y="320" width="75" height="8" rx="4" fill="#ffd1df"/>
    </g>

    <!-- Magic Sparkles -->
    <g fill="url(#goldGradM)">
      <path d="M110 80 Q120 105 145 115 Q120 125 110 150 Q100 125 75 115 Q100 105 110 80 Z"/>
      <path d="M410 370 Q416 385 431 391 Q416 397 410 412 Q404 397 389 391 Q404 385 410 370 Z"/>
      <circle cx="395" cy="180" r="10"/>
    </g>
  </g>
</svg>
